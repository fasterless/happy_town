<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邻里小镇 v2.0</title>
  <link rel="stylesheet" href="styles.css">
  <!-- v2 的渲染结构和 v1 不同，这里补齐 v2 专属的类名样式 -->
  <link rel="stylesheet" href="styles_v2.css">
</head>
<body>
  <!-- 应用容器 -->
  <div class="app-shell">
    <!-- 顶部栏 -->
    <header id="topbar" class="topbar"></header>

    <!-- 主游戏区域 -->
    <main class="game-layout">
      <!-- 左侧栏 -->
      <aside class="left-rail">
        <div id="notice" class="notice-panel"></div>
        <div id="miniInventory" class="mini-inventory"></div>
      </aside>

      <!-- 主舞台 -->
      <section class="main-stage">
        <!-- Toast 提示 -->
        <div id="toast" class="toast"></div>

        <!-- 农场视图 -->
        <section id="farmView" class="view active-view">
          <div class="view-header">
            <h2>🌾 农场</h2>
            <div class="header-actions">
              <button id="plantAllButton" class="ghost-action">一键种植</button>
              <button id="collectAllButton" class="primary-action">收获成熟作物</button>
            </div>
          </div>
          <div id="expansionPanel" class="expansion-panel"></div>
          <div id="farmGrid" class="farm-grid"></div>
          <div class="seed-shop">
            <h3>种子铺</h3>
            <div id="seedList" class="seed-list"></div>
          </div>
          <div class="sell-barn">
            <h3>🌾 卖仓</h3>
            <div id="sellBarnList" class="sell-barn-list"></div>
          </div>
        </section>

        <!-- 订单视图 -->
        <section id="ordersView" class="view">
          <div class="view-header">
            <h2>📋 订单</h2>
          </div>
          <div id="ordersList" class="orders-list"></div>
        </section>

        <!-- 家园视图 -->
        <section id="homeView" class="view">
          <div class="view-header">
            <h2>🏠 家园</h2>
            <div class="button-row">
              <button id="clearRoomButton" class="ghost-action">清空房间</button>
              <button id="saveRoomButton" class="primary-action">保存布局</button>
            </div>
          </div>
          <div id="roomScore" class="room-score-panel"></div>
          <div id="roomGrid" class="room-grid"></div>
          <div class="furniture-shop">
            <h3>家具商店</h3>
            <div id="furnitureList" class="furniture-list"></div>
          </div>
        </section>

        <!-- 好友视图 -->
        <section id="friendsView" class="view">
          <div class="view-header">
            <h2>👥 好友</h2>
          </div>
          <div id="friendsList" class="friends-list"></div>
        </section>

        <!-- 社区视图 -->
        <section id="communityView" class="view">
          <div class="view-header">
            <h2>⛲ 社区</h2>
          </div>
          <div id="communityContent" class="community-content"></div>
        </section>

        <!-- 商城视图 -->
        <section id="shopView" class="view">
          <div class="view-header">
            <h2>🛍️ 商城</h2>
          </div>
          <div id="shopList" class="shop-list"></div>
        </section>

        <!-- 任务视图 -->
        <section id="tasksView" class="view">
          <div class="view-header">
            <h2>✅ 任务</h2>
            <button id="resetDailyButton" class="ghost-action">重置每日</button>
          </div>
          <div class="tasks-container">
            <div class="active-score-panel">
              <h3>活跃度: <span id="activeScoreDisplay">0</span></h3>
            </div>
            <div id="activeBoxes" class="active-boxes"></div>
            <h3>每日任务</h3>
            <div id="tasksList" class="tasks-list"></div>
          </div>
        </section>

        <!-- 成就视图 -->
        <section id="achievementsView" class="view">
          <div class="view-header">
            <h2>🏆 成就</h2>
            <p id="achievementStats" class="achievement-stats"></p>
          </div>
          <div id="achievementsList" class="achievements-list"></div>
        </section>

        <!-- 宠物视图 -->
        <section id="petsView" class="view">
          <div class="view-header">
            <h2>🐾 宠物</h2>
          </div>
          <div id="petsList" class="pets-content"></div>
        </section>

        <!-- 养殖栏视图 -->
        <section id="ranchView" class="view">
          <div class="view-header">
            <h2>🐮 养殖栏</h2>
            <button id="collectAllRanchButton" class="primary-action">一键收取</button>
          </div>
          <div id="ranchList" class="ranch-content"></div>
        </section>

        <!-- 加工坊视图 -->
        <section id="craftingView" class="view">
          <div class="view-header">
            <h2>🥖 加工坊</h2>
            <button id="claimAllCraftButton" class="primary-action">领取全部成品</button>
          </div>
          <h3>加工台</h3>
          <div id="craftQueue" class="craft-queue"></div>
          <h3>配方</h3>
          <div id="recipeList" class="recipe-list"></div>
        </section>

        <!-- 钓鱼视图 -->
        <section id="fishingView" class="view">
          <div class="view-header">
            <h2>🎣 湖畔</h2>
          </div>
          <div id="fishingPond" class="fishing-content"></div>
          <h3>图鉴</h3>
          <div id="fishCollection" class="fish-grid"></div>
          <div id="fishingActions" class="fishing-actions"></div>
        </section>

        <!-- 转盘视图 -->
        <section id="lotteryView" class="view">
          <div class="view-header">
            <h2>🎡 幸运转盘</h2>
          </div>
          <div id="lotteryPanel" class="lottery-content"></div>
          <h3>奖池</h3>
          <div id="prizeList" class="prize-grid"></div>
        </section>

        <!-- 季节活动视图 -->
        <section id="seasonsView" class="view">
          <div class="view-header">
            <h2>🌸 季节活动</h2>
          </div>
          <div id="seasonsList" class="seasons-list"></div>
        </section>

        <!-- 后台视图 -->
        <section id="adminView" class="view">
          <div class="view-header">
            <h2>📊 后台</h2>
          </div>
          <div id="adminContent" class="admin-content">
            <button id="testRewardButton" class="primary-action">发放测试补偿</button>
            <div id="statsPanel" class="stats-panel"></div>
          </div>
        </section>
      </section>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-button" data-view="farmView">🌾<br><small>农场</small></button>
      <button class="nav-button" data-view="ordersView">📋<br><small>订单</small></button>
      <button class="nav-button" data-view="homeView">🏠<br><small>家园</small></button>
      <button class="nav-button" data-view="friendsView">👥<br><small>好友</small></button>
      <button class="nav-button" data-view="communityView">⛲<br><small>社区</small></button>
      <button class="nav-button" data-view="shopView">🛍️<br><small>商城</small></button>
      <button class="nav-button" data-view="tasksView">✅<br><small>任务</small></button>
      <button class="nav-button" data-view="achievementsView">🏆<br><small>成就</small></button>
      <button class="nav-button" data-view="petsView">🐾<br><small>宠物</small></button>
      <button class="nav-button" data-view="ranchView">🐮<br><small>养殖栏</small></button>
      <button class="nav-button" data-view="craftingView">🥖<br><small>加工坊</small></button>
      <button class="nav-button" data-view="fishingView">🎣<br><small>湖畔</small></button>
      <button class="nav-button" data-view="lotteryView">🎡<br><small>转盘</small></button>
      <button class="nav-button" data-view="seasonsView">🌸<br><small>季节</small></button>
      <button class="nav-button" data-view="adminView">📊<br><small>后台</small></button>
    </nav>
  </div>

  <!-- 创建角色模态框 -->
  <div id="roleModal" class="modal-backdrop">
    <div class="role-card">
      <h2>🏡 欢迎来到邻里小镇</h2>
      <p>请创建你的角色</p>

      <label for="nicknameInput">昵称（2-12个字符）</label>
      <input type="text" id="nicknameInput" maxlength="12" placeholder="输入你的昵称">

      <label>选择头像</label>
      <div id="avatarChoices" class="avatar-choices"></div>

      <button id="createRoleButton" class="primary-action" type="button">进入小镇</button>
    </div>
  </div>

  <!-- 加载主程序（使用 type="module"） -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
